name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + signed APKs
    runs-on: ubuntu-latest
    env:
      AMLA_STORE_PASSWORD: ${{ secrets.AMLA_STORE_PASSWORD }}
      AMLA_KEY_PASSWORD: ${{ secrets.AMLA_KEY_PASSWORD }}
      AMLA_KEY_ALIAS: ${{ secrets.AMLA_KEY_ALIAS }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Maven Central occasionally answers 429 under CI load; retry transient
      # dependency-resolution failures before declaring the build broken.
      - name: Run unit tests
        run: |
          for attempt in 1 2 3; do
            if ./gradlew testDebugUnitTest --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Unit test attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "APK build attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amla-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Release build attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: amla-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
