<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181B"/>
      <stop offset="100%" stop-color="#1C2226"/>
    </linearGradient>
    <clipPath id="fruit">
      <circle cx="168" cy="250" r="86"/>
    </clipPath>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="168" cy="250" r="124" fill="#20272B"/>

  <!-- amla fruit + EQ bars mark -->
  <line x1="168" y1="166" x2="176" y2="146" stroke="#7A5A32" stroke-width="8" stroke-linecap="round"/>
  <circle cx="168" cy="250" r="86" fill="#4C9A2A" stroke="#2F6B1B" stroke-width="5"/>
  <g clip-path="url(#fruit)" stroke-linecap="round">
    <g stroke="#CDEAA6" stroke-width="13">
      <line x1="118" y1="320" x2="118" y2="272"/>
      <line x1="144" y1="320" x2="144" y2="214"/>
      <line x1="170" y1="320" x2="170" y2="180"/>
      <line x1="196" y1="320" x2="196" y2="236"/>
      <line x1="222" y1="320" x2="222" y2="264"/>
    </g>
    <g stroke="#2F6B1B" stroke-width="5" opacity="0.55">
      <line x1="131" y1="320" x2="131" y2="292"/>
      <line x1="157" y1="320" x2="157" y2="244"/>
      <line x1="183" y1="320" x2="183" y2="204"/>
      <line x1="209" y1="320" x2="209" y2="246"/>
    </g>
  </g>
  <ellipse cx="132" cy="206" rx="30" ry="14" fill="#FFFFFF" opacity="0.22" transform="rotate(-35 132 206)"/>

  <!-- wordmark -->
  <text x="330" y="228" font-family="DejaVu Sans, sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">Amla</text>
  <text x="334" y="288" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#6A2BD9">Smart Equalizer</text>
  <text x="334" y="350" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#CDEAA6">Sound, your way.</text>

  <rect x="330" y="392" width="220" height="6" rx="3" fill="#4C9A2A"/>
  <rect x="562" y="392" width="90" height="6" rx="3" fill="#6A2BD9"/>
</svg>
