<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Amla logo">
  <defs>
    <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C2E056"/>
      <stop offset="45%" stop-color="#8FC23A"/>
      <stop offset="100%" stop-color="#4F8424"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CBF45"/>
      <stop offset="100%" stop-color="#2F7A2B"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A98452"/>
      <stop offset="100%" stop-color="#6E4E2C"/>
    </linearGradient>
    <pattern id="speck" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.2" fill="#355C20" opacity="0.45"/>
      <circle cx="13" cy="12" r="0.9" fill="#355C20" opacity="0.35"/>
      <circle cx="8" cy="15" r="0.7" fill="#355C20" opacity="0.3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="56" fill="#F2EBE1"/>

  <!-- branch and twigs -->
  <path d="M292 52 C280 100 268 142 256 196" fill="none" stroke="url(#branch)" stroke-width="10" stroke-linecap="round"/>
  <path d="M279 96 C244 84 214 74 186 84" fill="none" stroke="url(#branch)" stroke-width="6" stroke-linecap="round"/>
  <path d="M270 128 C304 108 336 104 366 116" fill="none" stroke="url(#branch)" stroke-width="6" stroke-linecap="round"/>
  <path d="M262 160 C228 150 202 158 178 178" fill="none" stroke="url(#branch)" stroke-width="5" stroke-linecap="round"/>

  <!-- leaves -->
  <g stroke="#2C6226" stroke-width="3" stroke-linejoin="round">
    <path d="M186 84 C132 44 78 56 58 100 C104 126 152 122 186 84 Z" fill="url(#leaf)"/>
    <path d="M279 96 C310 40 372 38 414 76 C364 108 312 116 279 96 Z" fill="url(#leaf)"/>
    <path d="M270 128 C316 92 380 108 402 158 C350 172 300 162 270 128 Z" fill="url(#leaf)"/>
    <path d="M262 160 C214 130 160 156 146 212 C196 208 240 194 262 160 Z" fill="url(#leaf)"/>
    <path d="M256 196 C214 180 180 202 170 240 C206 242 238 226 256 196 Z" fill="url(#leaf)"/>
  </g>
  <g stroke="#3F7E32" stroke-width="2" fill="none" opacity="0.75">
    <path d="M64 99 L180 85"/>
    <path d="M408 74 L282 96"/>
    <path d="M398 154 L272 129"/>
    <path d="M149 208 L260 161"/>
    <path d="M173 238 L254 196"/>
  </g>

  <!-- amla berries, back to front -->
  <g stroke="#5E7A28" stroke-width="3.5">
    <circle cx="256" cy="205" r="76" fill="url(#berry)"/>
    <circle cx="256" cy="205" r="76" fill="url(#speck)"/>
    <circle cx="155" cy="305" r="84" fill="url(#berry)"/>
    <circle cx="155" cy="305" r="84" fill="url(#speck)"/>
    <circle cx="288" cy="310" r="90" fill="url(#berry)"/>
    <circle cx="288" cy="310" r="90" fill="url(#speck)"/>
    <circle cx="245" cy="388" r="82" fill="url(#berry)"/>
    <circle cx="245" cy="388" r="82" fill="url(#speck)"/>
  </g>

  <!-- glossy highlights -->
  <g fill="#FFFFFF" opacity="0.72">
    <ellipse cx="228" cy="174" rx="19" ry="11" transform="rotate(-28 228 174)"/>
    <ellipse cx="124" cy="272" rx="21" ry="12" transform="rotate(-28 124 272)"/>
    <ellipse cx="258" cy="276" rx="24" ry="13" transform="rotate(-28 258 276)"/>
    <ellipse cx="212" cy="354" rx="22" ry="12" transform="rotate(-28 212 354)"/>
  </g>

  <text x="256" y="503" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="9" fill="#5B4934">AMLA</text>
</svg>
